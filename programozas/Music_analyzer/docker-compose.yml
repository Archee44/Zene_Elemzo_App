services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music_analyzer_backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./models:/app/models
    restart: unless-stopped

